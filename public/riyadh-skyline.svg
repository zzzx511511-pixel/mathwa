<svg width="1600" height="700" viewBox="0 0 1600 700" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="800" y1="0" x2="800" y2="700" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8A5A35"/>
      <stop offset="0.45" stop-color="#5C341D"/>
      <stop offset="1" stop-color="#2C140D"/>
    </linearGradient>
    <radialGradient id="sun" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1120 120) rotate(90) scale(210 320)">
